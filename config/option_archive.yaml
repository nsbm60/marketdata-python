# Sole application config for the option_archive package.
# Read only via option_archive.config.load_config(). Do not parse this file elsewhere.

# Backfill span. Trades reach back to 2014; the binding floor is Alpaca's earliest
# SIP date, 2016-01-04 (spot for moneyness). We seed from there. Quotes only exist
# from 2022-03-07, so 2016-01-04..2022-03-06 trades land permanently quote-NULL —
# the honest "quote unavailable", handled by the two separate floors below.
backfill_start_date: "2016-01-04"

# Quotes are only enriched on/after this floor (Massive quotes history from
# 2022-03-07); pre-2022 trades keep NULL quote columns forever.
quotes_available_from: "2022-03-07"

# Screened universe (the flat-file volume screen is DEFERRED — first data is
# seeded from the watchlist only; these params drive the screen when it runs).
universe:
  top_n: 100
  ranking_years: [2022, 2023, 2024, 2025, 2026]
  index_products: []     # SPY/QQQ are now INCLUDED at a reduced band (see band_overrides)
  watchlist_always_include: true

# Per-era capture bands (resolved parameters — do not widen/narrow without a spec change).
bands:
  perishable:            # within a year of roll-off; err wide, never re-pullable
    moneyness_band: 0.50
    max_dte_days: 365
  routine:               # re-pullable if regretted
    moneyness_band: 0.30
    max_dte_days: 90

# Per-underlying band overrides — apply in BOTH eras (no wide perishable band).
# SPY/QQQ: tight ±10%/90DTE captures the ATM/term-structure core the ML features
# want and drops the deep wings that make index chains enormous (~16.8k in-band
# contracts each at the standard band). Full-width index surface is a named future
# expansion, not a regret risk (index wings aren't irreplaceable single-name history).
band_overrides:
  SPY: {moneyness_pct: 10, dte_max: 90}
  QQQ: {moneyness_pct: 10, dte_max: 90}

# Per-underlying expiry-weekday exclusion. SPY/QQQ are dominated by short-dated
# expirations, not OTM wings, so moneyness is not the reduction lever — dropping the
# Tue/Thu dailies is. Small on 2024 dates, dense 2026-forward (where the value is).
expiry_weekday_exclude:
  SPY: [Tue, Thu]
  QQQ: [Tue, Thu]
quotes_band:             # quotes-at-trades everywhere (trade record is the unrecoverable thing)
  moneyness_band: 0.30
  max_dte_days: 90

# Dates dropped entirely (collector-side outages, etc.). List, not a hardcode.
excluded_dates: []

# Worst-case rolling retention assumption + alert margin before a year rolls off.
roll_off:
  assumed_retention_years: 5
  alert_margin_days: 60

# Pacing schedule as clock boundaries: each window begins at start_et and runs
# until the next window starts (wrapping midnight). One number per boundary — no
# end times to keep consistent, so overlap/gap can't happen. requests_per_sec is a
# PLACEHOLDER calibrated on the first live day (spec Open item 1) — the queue is
# resumable, so an under-rate only slows, never truncates.
schedule:
  - kind: polite         # daytime (07:00–20:00), reduced so the link stays usable
    start_et: "07:00"
    requests_per_sec: 1.0
    worker_count: 2       # 2 systemd instances run continuously; the endpoint stalls
  - kind: aggressive     # overnight (20:00–07:00), full throttle
    start_et: "20:00"
    requests_per_sec: 5.0
    worker_count: 2       # under load, so start at 2 (x multipart 16 = 32 connections)

# Work-queue policy: claim lease (dead-worker recovery), vendor-failure retry cap,
# exponential backoff base. A day-ingest holds its claims while downloading +
# spot-joining, so the lease must comfortably exceed that; tune from measurement.
queue:
  lease_seconds: 1800
  max_attempts: 5
  backoff_base_seconds: 60

# S3 flat-file transfer. The vendor throttles a single connection (~0.9 MB/s
# measured 2026-09-25); managed multipart across max_concurrency connections hit
# ~4.7 MB/s (5x). read_timeout is generous — the 60s default aborts a slow large
# download mid-stream (a client deadline shorter than the work on a healthy link).
s3:
  connect_timeout_seconds: 30
  read_timeout_seconds: 600
  max_concurrency: 16
  multipart_chunksize_mb: 8
  multipart_threshold_mb: 8

# SQLite work-queue DB — MUST be outside the repo, git-ignored (Resolved decision 1).
# On the Linux box this points under the mdapps data dir; here it defaults to the
# per-user data dir. load_config() rejects any path inside the repo.
queue_db_path: "~/.local/share/option_archive/queue.db"

# ClickHouse table names (DDL lives in the Scala MarketData schema/migrations).
tables:
  option_trade: "trading.option_trade"   # trades carry the as-of quote on the same row
  split: "trading.split"
  universe_ranking: "trading.option_universe_ranking"
  ingest_log: "trading.ingest_log"
  dividend: "trading.dividend"
  option_contract: "trading.option_contract"
  watchlist: "trading.watchlist"
